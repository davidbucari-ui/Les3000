<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le 3000 — compteur de points</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Karla:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --felt:#12402F;
  --felt-2:#17513B;
  --felt-3:#0C2C20;
  --bone:#F2EDE1;
  --brass:#D8A82B;
  --pip:#A82F27;
  --ink:#081C15;
  --muted:rgba(242,237,225,.62);
  --line:rgba(242,237,225,.16);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(120% 80% at 50% -10%, var(--felt-2) 0%, var(--felt) 45%, var(--felt-3) 100%);
  background-attachment:fixed;
  color:var(--bone);
  font-family:"Karla",system-ui,sans-serif;
  font-size:16px;line-height:1.45;
  min-height:100dvh;
  -webkit-tap-highlight-color:transparent;
}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}

/* ---------- type ---------- */
h1,h2,.num{font-family:"Anton",Impact,sans-serif;font-weight:400;letter-spacing:.01em;text-transform:uppercase}
h1{font-size:clamp(38px,13vw,60px);line-height:.92;margin:0}
h1 .thin{display:block;font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.34em;color:var(--brass);text-transform:uppercase;margin-bottom:10px}
h2{font-size:14px;letter-spacing:.18em;color:var(--muted);margin:0 0 10px}
.mono{font-family:"Space Mono",monospace}
.hint{font-size:13px;color:var(--muted)}

/* ---------- surfaces ---------- */
.card{
  background:rgba(255,255,255,.05);
  border:1px solid var(--line);
  border-radius:14px;padding:16px;margin-bottom:14px;
}
.rule{height:1px;background:var(--line);margin:16px 0}

/* ---------- controls ---------- */
button{font-family:inherit;font-size:15px;cursor:pointer;border-radius:10px;border:1px solid var(--line);
  background:rgba(255,255,255,.06);color:var(--bone);padding:12px 14px;transition:transform .08s ease,background .15s ease}
button:active{transform:scale(.97)}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.btn-brass{background:var(--brass);color:#20180A;border-color:var(--brass);font-weight:700}
.btn-danger{background:var(--pip);border-color:var(--pip);color:#fff;font-weight:700}
.btn-ghost{background:transparent}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
input[type=text],input[type=number]{
  font-family:inherit;font-size:16px;width:100%;padding:12px;border-radius:10px;
  border:1px solid var(--line);background:rgba(0,0,0,.22);color:var(--bone)}
input:focus{outline:2px solid var(--brass);outline-offset:1px}
label.opt{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:14px;cursor:pointer}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:9px 4px;font-size:13px}
.seg button[aria-pressed=true]{background:var(--bone);color:var(--ink);border-color:var(--bone);font-weight:700}

/* ---------- dice ---------- */
.dice-row{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.die{
  aspect-ratio:1;padding:0;border-radius:12px;
  background:var(--bone);border:1px solid rgba(0,0,0,.2);
  box-shadow:0 3px 0 rgba(0,0,0,.28);
  display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);gap:2px;padding:14%;
}
.die .pip{background:var(--pip);border-radius:50%;align-self:center;justify-self:center;width:82%;aspect-ratio:1}
.die:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.28)}

/* ---------- pot ---------- */
.pot{text-align:center;padding:22px 16px 18px;border:1px solid var(--line);border-radius:14px;
  background:linear-gradient(180deg,rgba(216,168,43,.14),rgba(216,168,43,0));margin-bottom:14px}
.pot .num{font-size:76px;line-height:.85;color:var(--brass);display:block}
.pot.risk .num{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.62}}
.pot small{font-family:"Space Mono",monospace;font-size:10.5px;letter-spacing:.28em;color:var(--muted);text-transform:uppercase}
.turnlog{font-family:"Space Mono",monospace;font-size:12px;color:var(--muted);margin-top:10px;min-height:18px;word-break:break-word}

/* ---------- scoreboard ---------- */
.player{display:flex;align-items:baseline;gap:12px;padding:11px 12px;border-radius:10px;margin-bottom:6px;
  background:rgba(0,0,0,.16);border-left:3px solid transparent}
.player.active{background:rgba(216,168,43,.13);border-left-color:var(--brass)}
.player .nm{flex:1;font-weight:700;font-size:15px}
.player .sc{font-family:"Anton",sans-serif;font-size:24px}
.player .bar{height:3px;background:var(--brass);border-radius:2px;margin-top:6px}
.tag{font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}

.banner{background:var(--pip);color:#fff;padding:10px 12px;border-radius:10px;font-size:14px;margin-bottom:12px}
.banner.info{background:rgba(216,168,43,.16);border:1px solid rgba(216,168,43,.4);color:var(--bone)}
.win{text-align:center;padding:26px 16px}
.win .num{font-size:54px;color:var(--brass);display:block;margin:8px 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const app = document.getElementById('app');
let MULT = 1;

/* ---------- sauvegarde locale ---------- */
const KEY = 'les3000:v1';
function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify({
      phase:S.phase, names:S.names, players:S.players,
      target:S.target, entry:S.entry, exact:S.exact,
      current:S.current, pot:S.pot, log:S.log,
      winner:S.winner, snapshots:S.snapshots
    }));
  }catch(e){/* stockage indisponible : la partie reste en mémoire */}
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return false;
    const d = JSON.parse(raw);
    if(!d || !d.phase || !Array.isArray(d.players)) return false;
    Object.assign(S, d);
    S.msg = d.phase === 'play' ? 'Partie reprise là où vous l\'aviez laissée.' : '';
    S.msgKind = 'info';
    return true;
  }catch(e){ return false }
}
function clearSave(){ try{ localStorage.removeItem(KEY) }catch(e){} }
const S = {
  phase:'setup',
  names:['',''],
  players:[],
  target:3000, entry:0, exact:false,
  current:0, pot:0, log:[], msg:'', msgKind:'', winner:null,
  snapshots:[]
};
const PIPS = {1:[5],2:[1,9],3:[1,5,9],4:[1,3,7,9],5:[1,3,5,7,9],6:[1,3,4,6,7,9]};
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function dieSVG(v){
  return PIPS[v].map(i=>`<span class="pip" style="grid-area:${Math.ceil(i/3)}/${((i-1)%3)+1}"></span>`).join('');
}

/* ---------- setup ---------- */
function renderSetup(){
  app.innerHTML = `
  <h1><span class="thin">Compteur de points</span>Le 3000</h1>
  <p class="hint" style="margin:14px 0 20px">Cinq dés, un pot qui grossit, et la question à chaque lancer&nbsp;: on banque ou on relance&nbsp;?</p>

  <div class="card">
    <h2>Joueurs</h2>
    <div id="names"></div>
    <div class="row" style="margin-top:10px">
      <button class="btn-ghost" id="addP">Ajouter un joueur</button>
    </div>
  </div>

  <div class="card">
    <h2>Règles de la partie</h2>
    <p class="hint" style="margin:0 0 6px">Objectif</p>
    <div class="seg" data-seg="target">
      ${[3000,5000,10000].map(v=>`<button data-v="${v}" aria-pressed="${S.target===v}">${v}</button>`).join('')}
    </div>
    <p class="hint" style="margin:14px 0 6px">Ouverture — points minimum à faire en un tour pour entrer en jeu</p>
    <input type="number" id="entryVal" min="0" step="50" inputmode="numeric" value="${S.entry}" aria-label="Montant de l'ouverture">
    <div class="seg" data-seg="entry" style="margin-top:8px">
      ${[0,300,500,1000].map(v=>`<button data-v="${v}" aria-pressed="${S.entry===v}">${v===0?'Aucune':v}</button>`).join('')}
    </div>
    <p class="hint" style="margin:8px 0 0;font-size:12px">Mettez 0 pour que chacun marque dès le premier tour.</p>
    <label class="opt"><input type="checkbox" id="exact" ${S.exact?'checked':''}> Il faut tomber exactement sur ${S.target} pour gagner</label>
  </div>

  <button class="btn-brass" style="width:100%;padding:16px;font-size:17px" id="start">Commencer la partie</button>
  <p class="hint" style="text-align:center;margin-top:14px">1&nbsp;=&nbsp;100 · 5&nbsp;=&nbsp;50 · brelan de 1&nbsp;=&nbsp;1000 · brelan de X&nbsp;=&nbsp;X00 · carré&nbsp;=&nbsp;×2 · quinté&nbsp;=&nbsp;×4 · suite&nbsp;=&nbsp;500</p>`;

  const nb = document.getElementById('names');
  nb.innerHTML = S.names.map((n,i)=>`
    <div class="row" style="margin-bottom:8px">
      <input type="text" placeholder="Joueur ${i+1}" value="${esc(n)}" data-i="${i}">
      ${S.names.length>2?`<button class="btn-ghost" style="flex:0 0 46px" data-del="${i}" aria-label="Retirer">×</button>`:''}
    </div>`).join('');
  nb.querySelectorAll('input').forEach(inp=>inp.oninput=e=>{S.names[+e.target.dataset.i]=e.target.value});
  nb.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{S.names.splice(+b.dataset.del,1);renderSetup()});

  document.getElementById('addP').onclick=()=>{if(S.names.length<8){S.names.push('');renderSetup()}};
  document.querySelectorAll('[data-seg]').forEach(seg=>seg.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    S[seg.dataset.seg]=+b.dataset.v;renderSetup();
  }));
  document.getElementById('exact').onchange=e=>S.exact=e.target.checked;
  const ev = document.getElementById('entryVal');
  ev.oninput = e => {
    const n = parseInt(e.target.value,10);
    S.entry = isNaN(n) || n < 0 ? 0 : n;
    document.querySelectorAll('[data-seg=entry] button').forEach(b=>b.setAttribute('aria-pressed', +b.dataset.v===S.entry));
    save();
  };
  document.getElementById('start').onclick=()=>{
    S.players = S.names.map((n,i)=>({name:(n||'').trim()||`Joueur ${i+1}`,score:0,in:S.entry===0}));
    S.phase='play';S.current=0;S.pot=0;S.log=[];S.msg='';S.snapshots=[];
    render();
  };
}

/* ---------- jeu ---------- */
function add(pts,label){
  S.pot += pts;
  S.log.push({pts,label});
  S.msg='';
  render();
}
function undoRoll(){ if(S.log.length){const l=S.log.pop();S.pot-=l.pts;render()} }

function snapshot(){
  S.snapshots.push(JSON.stringify({players:S.players,current:S.current,pot:S.pot,log:S.log,winner:S.winner}));
  if(S.snapshots.length>30) S.snapshots.shift();
}
function undoTurn(){
  if(!S.snapshots.length) return;
  const s = JSON.parse(S.snapshots.pop());
  Object.assign(S,s);S.msg='';render();
}
function nextPlayer(){ S.current=(S.current+1)%S.players.length;S.pot=0;S.log=[]; }

function bank(){
  const p = S.players[S.current];
  if(!p.in && S.pot < S.entry){
    S.msg = `${p.name} n'est pas encore entré en jeu : il faut ${S.entry} points en un seul tour. Le tour est perdu.`; S.msgKind='';
    snapshot(); nextPlayer(); render(); return;
  }
  const total = p.score + S.pot;
  if(S.exact && total > S.target){
    S.msg = `${total} dépasse ${S.target} : le tour ne compte pas, il faut tomber juste.`; S.msgKind='';
    snapshot(); nextPlayer(); render(); return;
  }
  snapshot();
  p.in = true;
  p.score = total;
  if(p.score >= S.target){ S.winner = p.name; S.phase='win'; render(); return; }
  S.msg = `${p.name} banque ${S.pot}.`; S.msgKind='info';
  nextPlayer(); render();
}
function bust(){
  snapshot();
  S.msg = `${S.players[S.current].name} perd ${S.pot} points.`; S.msgKind='';
  nextPlayer(); render();
}

function renderPlay(){
  const p = S.players[S.current];
  const need = S.target - p.score;
  app.innerHTML = `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <span class="tag">Objectif ${S.target}</span>
    <button class="btn-ghost" style="padding:7px 12px;font-size:13px" id="undoT" ${S.snapshots.length?'':'disabled'}>Annuler le tour précédent</button>
  </div>

  ${S.msg?`<div class="banner ${S.msgKind==='info'?'info':''}">${esc(S.msg)}</div>`:''}

  <div style="text-align:center;margin-bottom:10px">
    <span class="tag">Au tour de</span>
    <h1 style="font-size:34px;margin-top:4px">${esc(p.name)}</h1>
    <p class="hint mono" style="margin:6px 0 0">${p.score} pts · ${need} pour gagner${p.in?'':` · pas encore entré (${S.entry})`}</p>
  </div>

  <div class="pot ${S.pot>0?'risk':''}">
    <small>Points en jeu ce tour</small>
    <span class="num">${S.pot}</span>
    <div class="turnlog">${S.log.length?S.log.map(l=>l.label).join('  ·  '):'Lancez les dés, puis enregistrez ce qui marque.'}</div>
  </div>

  <div class="row" style="margin-bottom:14px">
    <button class="btn-brass" id="bank" style="padding:16px">Banquer ${S.pot||''}</button>
    <button class="btn-danger" id="bust" style="padding:16px">Rien ne marque</button>
  </div>

  <div class="card">
    <h2>Dés isolés</h2>
    <div class="row">
      <button data-add="100" data-l="un 1">Un 1 · +100</button>
      <button data-add="50" data-l="un 5">Un 5 · +50</button>
    </div>

    <div class="rule"></div>
    <h2>Combinaison — choisissez le dé</h2>
    <div class="seg" data-seg2="mult" style="margin-bottom:10px">
      <button data-v="1" aria-pressed="${MULT===1}">Brelan ×3</button>
      <button data-v="2" aria-pressed="${MULT===2}">Carré ×4</button>
      <button data-v="4" aria-pressed="${MULT===4}">Quinté ×5</button>
    </div>
    <div class="dice-row">
      ${[1,2,3,4,5,6].map(v=>`<button class="die" data-face="${v}" aria-label="${v}">${dieSVG(v)}</button>`).join('')}
    </div>

    <div class="rule"></div>
    <div class="row">
      <button data-add="500" data-l="suite">Suite · +500</button>
      <button class="btn-ghost" id="manual">Saisir un montant</button>
    </div>
    <div class="row" style="margin-top:8px">
      <button class="btn-ghost" id="undoR" ${S.log.length?'':'disabled'}>Annuler la dernière saisie</button>
    </div>
  </div>

  <div class="card">
    <h2>Scores</h2>
    ${S.players.map((q,i)=>`
      <div class="player ${i===S.current?'active':''}">
        <span class="nm">${esc(q.name)}${q.in?'':' <span class="tag">· hors jeu</span>'}</span>
        <span class="sc">${q.score}</span>
      </div>
      <div class="bar" style="width:${Math.min(100,q.score/S.target*100)}%;height:3px;background:var(--brass);border-radius:2px;margin:-4px 0 8px 12px"></div>`).join('')}
  </div>

  <button class="btn-ghost" style="width:100%" id="reset">Nouvelle partie</button>`;

  document.getElementById('bank').onclick = bank;
  document.getElementById('bust').onclick = bust;
  document.getElementById('undoR').onclick = undoRoll;
  document.getElementById('undoT').onclick = undoTurn;
  document.getElementById('reset').onclick = ()=>{if(confirm('Terminer cette partie et repartir de zéro ?')){clearSave();S.phase='setup';S.msg='';render()}};
  app.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(+b.dataset.add, `${b.dataset.l} +${b.dataset.add}`));
  app.querySelectorAll('[data-seg2] button').forEach(b=>b.onclick=()=>{MULT=+b.dataset.v;render()});
  app.querySelectorAll('[data-face]').forEach(b=>b.onclick=()=>{
    const v=+b.dataset.face, base = v===1?1000:v*100, pts = base*MULT;
    const nom = MULT===1?'brelan':MULT===2?'carré':'quinté';
    add(pts, `${nom} de ${v} +${pts}`);
  });
  document.getElementById('manual').onclick=()=>{
    const v = prompt('Points à ajouter au pot');
    const n = parseInt(v,10);
    if(!isNaN(n)) add(n, `saisie +${n}`);
  };
}

function renderWin(){
  app.innerHTML = `
  <div class="win">
    <span class="tag">Partie terminée</span>
    <h1 style="font-size:44px;margin-top:10px">${esc(S.winner)}</h1>
    <span class="num">${S.players.find(p=>p.name===S.winner).score}</span>
    <p class="hint">atteint ${S.target}.</p>
  </div>
  <div class="card">
    <h2>Classement</h2>
    ${[...S.players].sort((a,b)=>b.score-a.score).map(q=>`
      <div class="player"><span class="nm">${esc(q.name)}</span><span class="sc">${q.score}</span></div>`).join('')}
  </div>
  <div class="row">
    <button class="btn-ghost" id="undoT">Annuler le dernier tour</button>
    <button class="btn-brass" id="again">Rejouer</button>
  </div>`;
  document.getElementById('again').onclick=()=>{
    S.players.forEach(p=>{p.score=0;p.in=S.entry===0});
    S.current=0;S.pot=0;S.log=[];S.msg='';S.winner=null;S.snapshots=[];S.phase='play';render();
  };
  document.getElementById('undoT').onclick=()=>{S.phase='play';undoTurn()};
}

function render(){
  save();
  if(S.phase==='setup') renderSetup();
  else if(S.phase==='win') renderWin();
  else renderPlay();
  window.scrollTo({top:0,behavior:'instant'});
}
load();
render();
</script>
</body>
</html>
